# PR checks for the static GitHub Pages site (no build step).
#
# 1. build — validate briefings/index.html structure and that the tree serves over HTTP
# 2. links — lychee: internal links block the job; external links are advisory (continue-on-error)
# 3. e2e — Playwright smoke tests for /briefings/ and /briefings-preview/
# 4. e2e — axe on /briefings/ (fail only on critical violations; all hits are logged)
#
# Uses ubuntu-latest, open-source tools only, no secrets.

name: PR checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate briefings index
        run: |
          set -euo pipefail
          if [ ! -f briefings/index.html ]; then
            echo "missing briefings/index.html"
            exit 1
          fi
          if ! grep -q '<!-- ENTRIES -->' briefings/index.html; then
            echo "briefings/index.html is missing the <!-- ENTRIES --> marker"
            exit 1
          fi

      - name: Serve site and smoke-check HTTP
        run: |
          set -euo pipefail
          npx --yes http-server -p 8080 -c-1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/briefings/; then
              echo "briefings/ is reachable"
              exit 0
            fi
            sleep 1
          done
          echo "static server did not become ready on :8080"
          exit 1

  links:
    name: Broken links
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start static server
        run: |
          npx --yes http-server -p 8080 -c-1 &
          echo "8080" > /tmp/http-port
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          echo "server failed to start"
          exit 1

      # Root-relative and relative hrefs only (no http/https/mailto/tel/fragment-only).
      - name: Internal links (strict)
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: |
            --verbose
            --no-progress
            --base http://127.0.0.1:8080
            --exclude '^https?://'
            --exclude '^mailto:'
            --exclude '^tel:'
            --exclude '^#'
            **/*.html

      # External URLs: tolerant status codes, retries, and excludes for noisy redirectors.
      - name: External links (advisory)
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: |
            --verbose
            --no-progress
            --include '^https?://'
            --accept 200,206,429
            --max-retries 3
            --timeout 20
            --exclude 'news\.google\.com'
            --exclude '(^https?://)?(www\.)?google\.com/url'
            --exclude '(^https?://)?(www\.)?reddit\.com'
            --exclude '(^https?://)?(www\.)?redd\.it'
            --exclude '(^https?://)?(www\.)?linkedin\.com'
            --exclude '(^https?://)?(www\.)?facebook\.com'
            --exclude '(^https?://)?(www\.)?instagram\.com'
            --exclude '(^https?://)?(www\.)?t\.co'
            **/*.html

  e2e:
    name: Playwright & axe
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke + axe
        run: npm run test:e2e
