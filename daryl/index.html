<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daryl</title>
<meta name="robots" content="noindex,nofollow">
<style>
  /* Tokens from the MC house system, canonical at /mc.css */
  :root{
    --bg:#06070a; --ink:#e8ecf0; --dim:#8a929b; --faint:#585f68; --line-2:#2a3038;
    --ac-green:#6ee7b7; --ac-amber:#f5c451; --ac-blue:#7aa7ff; --ac-orange:#ff8f4a;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  .film{position:fixed;inset:0;background:var(--bg)}
  .scene{position:absolute;inset:0;opacity:0;transform:scale(1.08);
         transition:opacity .9s ease,transform 7s linear}
  .scene.on{opacity:1;transform:scale(1)}
  .scene svg{width:100%;height:100%;display:block}
  .cap{position:absolute;left:5vw;right:5vw;bottom:calc(9vh + env(safe-area-inset-bottom));z-index:5;
       font:600 clamp(12px,3.4vw,18px)/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;
       color:#f2f5f8;opacity:0;transform:translateY(10px);transition:opacity .7s ease .3s,transform .7s ease .3s;
       text-shadow:0 2px 16px rgba(0,0,0,.8)}
  .cap.on{opacity:1;transform:none}
  .cap::before{content:'';display:inline-block;width:.55em;height:.55em;margin-right:.7em;
               background:var(--ac-amber);vertical-align:middle;transform:translateY(-.1em)}
  .end{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:2.2vh;opacity:0;transition:opacity 1s ease .4s;text-align:center;padding:0 6vw}
  .end.on{opacity:1}
  .end .plan{margin-top:3vh;padding:14px 22px;border:1px solid var(--ac-amber);color:var(--ac-amber);
             font:600 clamp(11px,3vw,14px)/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;pointer-events:none}
  .end.on .plan{pointer-events:auto}
  .end .nm{font:700 clamp(34px,11vw,84px)/1 var(--mono);letter-spacing:.12em;color:var(--ink)}
  .end .tag{font:600 clamp(10px,2.8vw,14px)/1.6 var(--mono);letter-spacing:.24em;color:var(--ac-amber)}
  .play{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:18px;background:rgba(6,7,10,.55);border:0;cursor:pointer;color:var(--ink)}
  .play .ring{width:clamp(72px,20vw,110px);aspect-ratio:1;border-radius:50%;border:2px solid var(--ac-amber);
              display:flex;align-items:center;justify-content:center}
  .play .ring::after{content:'';margin-left:8%;border-style:solid;border-width:14px 0 14px 24px;
                     border-color:transparent transparent transparent var(--ac-amber)}
  .play .lbl{font:600 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .play.gone{display:none}
  /* mesh scene */
  .link{stroke-dasharray:200;stroke-dashoffset:200}
  .s5.on .link{animation:draw 2.2s ease forwards}
  .s5.on .link:nth-child(2){animation-delay:.5s}.s5.on .link:nth-child(3){animation-delay:1s}
  .s5.on .link:nth-child(4){animation-delay:1.5s}.s5.on .link:nth-child(5){animation-delay:2s}
  .s5.on .link:nth-child(6){animation-delay:2.5s}.s5.on .link:nth-child(7){animation-delay:3s}
  @keyframes draw{to{stroke-dashoffset:0}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
  .wave{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
  .wave:nth-of-type(2){animation-delay:.9s}.wave:nth-of-type(3){animation-delay:1.8s}
  .blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="film" id="film">

  <!-- 1 The Pub, door opens inward -->
  <div class="scene s1"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="320" height="180" fill="#1c140d"/>
    <g stroke="#3a2c1e" stroke-width="1"><line x1="0" y1="46" x2="320" y2="46"/><line x1="0" y1="96" x2="320" y2="96"/><line x1="64" y1="0" x2="64" y2="46"/><line x1="150" y1="46" x2="150" y2="96"/><line x1="250" y1="0" x2="250" y2="46"/></g>
    <rect x="120" y="58" width="80" height="112" fill="#0c0905"/>
    <polygon points="120,58 120,170 150,160 150,68" fill="#241a10"/>
    <path d="M120,58 L150,68 L150,160 L120,170" fill="none" stroke="#5a4428" stroke-width="1"/>
    <rect x="150" y="70" width="48" height="94" fill="#f5c451" opacity=".22"/>
    <text x="160" y="38" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" letter-spacing="4" fill="#9a7e4a">THE PUB</text>
  </svg></div>

  <!-- 2 Up the street -->
  <div class="scene s2"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="320" height="180" fill="#241812"/>
    <polygon points="0,0 120,40 120,180 0,180" fill="#1c130d"/>
    <polygon points="320,0 200,40 200,180 320,180" fill="#17100a"/>
    <g fill="#f5c451" opacity=".7"><rect x="22" y="60" width="11" height="17"/><rect x="22" y="96" width="11" height="17"/><rect x="60" y="72" width="11" height="17"/><rect x="286" y="60" width="11" height="17"/><rect x="286" y="98" width="11" height="17"/><rect x="250" y="74" width="11" height="17"/></g>
    <polygon points="120,180 200,180 170,70 150,70" fill="#0d0906"/>
    <circle cx="160" cy="80" r="3" fill="#f5c451"/>
  </svg></div>

  <!-- 3 Over the harbour, the airwaves open -->
  <div class="scene s3"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="320" height="180" fill="#1b252d"/>
    <rect y="118" width="320" height="62" fill="#111a20"/>
    <polygon points="0,118 0,94 40,94 48,102 110,102 118,94 170,94 178,102 240,102 248,94 320,94 320,118" fill="#2f2822"/>
    <g fill="#f5c451" opacity=".6"><rect x="30" y="98" width="4" height="6"/><rect x="90" y="98" width="4" height="6"/><rect x="200" y="98" width="4" height="6"/></g>
    <line x1="210" y1="94" x2="210" y2="58" stroke="#8a929b" stroke-width="1.2"/>
    <circle cx="210" cy="56" r="2.5" fill="#6ee7b7"/>
    <g fill="none" stroke="#6ee7b7" stroke-width="1"><circle class="wave" cx="210" cy="56" r="10"/><circle class="wave" cx="210" cy="56" r="10"/><circle class="wave" cx="210" cy="56" r="10"/></g>
  </svg></div>

  <!-- 4 Bruce on the Cardputer and a T-board -->
  <div class="scene s4"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="320" height="180" fill="#0a0e13"/>
    <!-- Cardputer -->
    <rect x="52" y="44" width="120" height="96" rx="8" fill="#1a1f26" stroke="#2a3038"/>
    <rect x="62" y="52" width="100" height="44" rx="2" fill="#05080b" stroke="#2a3038"/>
    <text x="68" y="63" font-family="ui-monospace,Menlo,monospace" font-size="6.5" fill="#ff8f4a" letter-spacing="1">BRUCE</text>
    <g font-family="ui-monospace,Menlo,monospace" font-size="5" fill="#8a929b"><text x="68" y="72">&gt; WiFi</text><text x="68" y="79">&gt; BLE</text><text x="68" y="86" fill="#6ee7b7">&gt; RF  &lt;</text><text x="68" y="93">&gt; NFC</text></g>
    <rect x="96" y="82" width="3" height="5" fill="#6ee7b7" class="blink"/>
    <g fill="#2a3038"><rect x="62" y="102" width="9" height="7" rx="1"/><rect x="74" y="102" width="9" height="7" rx="1"/><rect x="86" y="102" width="9" height="7" rx="1"/><rect x="98" y="102" width="9" height="7" rx="1"/><rect x="110" y="102" width="9" height="7" rx="1"/><rect x="122" y="102" width="9" height="7" rx="1"/><rect x="134" y="102" width="9" height="7" rx="1"/><rect x="146" y="102" width="9" height="7" rx="1"/><rect x="62" y="113" width="9" height="7" rx="1"/><rect x="74" y="113" width="9" height="7" rx="1"/><rect x="86" y="113" width="9" height="7" rx="1"/><rect x="98" y="113" width="9" height="7" rx="1"/><rect x="110" y="113" width="9" height="7" rx="1"/><rect x="122" y="113" width="9" height="7" rx="1"/><rect x="134" y="113" width="9" height="7" rx="1"/><rect x="146" y="113" width="9" height="7" rx="1"/><rect x="74" y="124" width="70" height="7" rx="1"/></g>
    <!-- T-board with antenna -->
    <rect x="198" y="64" width="72" height="62" rx="6" fill="#141a20" stroke="#2a3038"/>
    <rect x="207" y="72" width="54" height="30" rx="2" fill="#05080b" stroke="#2a3038"/>
    <text x="212" y="83" font-family="ui-monospace,Menlo,monospace" font-size="5" fill="#7aa7ff">LORA 868</text>
    <text x="212" y="92" font-family="ui-monospace,Menlo,monospace" font-size="5" fill="#8a929b">MESH: 4 NODES</text>
    <circle cx="234" cy="114" r="6" fill="none" stroke="#2a3038" stroke-width="1.5"/>
    <line x1="262" y1="64" x2="262" y2="30" stroke="#8a929b" stroke-width="2"/>
    <g fill="none" stroke="#7aa7ff" stroke-width="1"><circle class="wave" cx="262" cy="30" r="8"/><circle class="wave" cx="262" cy="30" r="8"/></g>
  </svg></div>

  <!-- 5 Off-grid mesh across the islands -->
  <div class="scene s5"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="320" height="180" fill="#070b10"/>
    <path d="M58,50 L92,42 L112,52 L104,66 L74,70 L56,62 Z" fill="#141c24" stroke="#24303a"/>
    <path d="M138,82 L190,70 L246,88 L270,112 L250,136 L196,140 L150,124 L132,102 Z" fill="#141c24" stroke="#24303a"/>
    <g fill="none" stroke="#6ee7b7" stroke-width="1.2">
      <line class="link" x1="84" y1="56" x2="152" y2="98"/>
      <line class="link" x1="152" y1="98" x2="196" y2="88"/>
      <line class="link" x1="196" y1="88" x2="240" y2="104"/>
      <line class="link" x1="152" y1="98" x2="186" y2="126"/>
      <line class="link" x1="186" y1="126" x2="240" y2="104"/>
      <line class="link" x1="196" y1="88" x2="186" y2="126"/>
    </g>
    <g fill="#6ee7b7"><circle cx="84" cy="56" r="3"/><circle cx="152" cy="98" r="3"/><circle cx="196" cy="88" r="3"/><circle cx="240" cy="104" r="3.5"/><circle cx="186" cy="126" r="3"/></g>
    <g fill="none" stroke="#6ee7b7" stroke-width="1"><circle class="pulse" cx="240" cy="104" r="4"/><circle class="pulse" cx="84" cy="56" r="4" style="animation-delay:1s"/></g>
    <text x="250" y="100" font-family="ui-monospace,Menlo,monospace" font-size="5.5" fill="#8a929b">VALLETTA</text>
    <text x="64" y="40" font-family="ui-monospace,Menlo,monospace" font-size="5.5" fill="#8a929b">GOZO</text>
  </svg></div>

  <!-- 6 End card -->
  <div class="scene s6"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="320" height="180" fill="#06070a"/></svg></div>

  <div class="cap" data-i="0">The Pub. Archbishop Street.</div>
  <div class="cap" data-i="1">Behind the bar, you read people every night.</div>
  <div class="cap" data-i="2">Out past the walls, the airwaves are wide open.</div>
  <div class="cap" data-i="3">Bruce firmware. A Cardputer. A LilyGO T-board.</div>
  <div class="cap" data-i="4">Off-grid mesh. Meshtastic. MeshCore. No towers.</div>
  <div class="end" id="end"><div class="nm">Daryl</div><div class="tag">SECURITY · RADIO · MESH</div><a class="plan" href="/darryl/">See the plan &rarr;</a></div>

  <button class="play" id="play" aria-label="Play with sound"><span class="ring"></span><span class="lbl">tap to play · sound on</span></button>
  <audio id="bed" src="chinook.mp3" preload="auto" playsinline></audio>
</div>

<script>
(function(){
  var cuts=[0,6,12,18,25,32], DUR=38;
  var scenes=[].slice.call(document.querySelectorAll('.scene'));
  var caps=[].slice.call(document.querySelectorAll('.cap'));
  var end=document.getElementById('end'), play=document.getElementById('play'), bed=document.getElementById('bed');
  var t0=null, cur=-1, useAudio=false;
  function idx(t){ var i=0; for(var k=0;k<cuts.length;k++) if(t>=cuts[k]) i=k; return i; }
  function show(i){
    if(i===cur) return; cur=i;
    scenes.forEach(function(s,k){ s.classList.toggle('on',k===i); });
    caps.forEach(function(c){ c.classList.toggle('on', +c.dataset.i===i); });
    end.classList.toggle('on', i===5);
  }
  function now(){ return useAudio ? bed.currentTime : ((performance.now()-t0)/1000)%DUR; }
  function tick(){ show(idx(now())); requestAnimationFrame(tick); }
  show(0);
  play.addEventListener('click', function(){
    play.classList.add('gone');
    t0=performance.now(); cur=-1;
    bed.currentTime=0;
    var p=bed.play();
    if(p&&p.then){ p.then(function(){ useAudio=true; }).catch(function(){ useAudio=false; }); } else { useAudio=true; }
    requestAnimationFrame(tick);
  });
  bed.addEventListener('ended', function(){ cur=-1; bed.currentTime=0; bed.play(); });
})();
</script>
</body>
</html>
