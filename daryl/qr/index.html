<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Scan — for Darryl</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{ --bg:#0b0b0d; --ink:#ece7dd; --dim:#9a948a; --ochre:#deac67;
         --mono:ui-monospace,'SF Mono',Menlo,monospace; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:5vmin;padding:6vmin 5vmin;text-align:center;-webkit-font-smoothing:antialiased}
  .kick{font-size:clamp(11px,3.2vw,15px);letter-spacing:.26em;text-transform:uppercase;color:var(--ochre)}
  .qr{width:min(78vmin,560px);aspect-ratio:1;background:#fff;border-radius:18px;
      padding:4.5vmin;box-shadow:0 0 0 1px rgba(236,231,221,.12),0 30px 80px rgba(0,0,0,.6)}
  .qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
  .url{font-size:clamp(13px,3.6vw,18px);letter-spacing:.14em;color:var(--ink)}
  .hint{font-size:clamp(10px,2.8vw,12px);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
</style>
</head>
<body>
  <div class="kick">For Darryl</div>
  <div class="qr"><img src="qr.svg" alt="QR code to mattcarpenter.com/darryl"></div>
  <div class="url">mattcarpenter.com/darryl</div>
  <div class="hint">point a camera here</div>
</body>
</html>
