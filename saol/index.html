  <div id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#984D61"></rect><circle cx="100" cy="100" r="40" fill="none" stroke="#FBF6F3" stroke-width="10"></circle></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rgin:0 0 32px;max-width:520px;font-size:clamp(17px,1.4vw,20px);line-height:1.55;color:#4A4450;text-wrap:pretty\">SAOL is a day service for women recovering from addiction. Safe, friendly, and ready to work at your pace, from wherever you are right now. In person in Dublin, or online and by phone anywhere in Ireland.<\/p>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <a href=\"tel:018553391\" style=\"padding:15px 24px;background:#2E2A33;border-radius:999px;color:#FBF6F3;font-weight:600;font-size:15px\" style-hover=\"background:#984D61;text-decoration:none\">Call us: (01) 855 3391<\/a>\n        <a href=\"#\" data-page=\"referral\" sc-camel-on-click=\"{{ go }}\" style=\"padding:15px 24px;border:1px solid #2E2A33;border-radius:999px;color:#2E2A33;font-weight:600;font-size:15px\" style-hover=\"background:#2E2A33;color:#FBF6F3;text-decoration:none\">Make a referral<\/a>\n      <\/div>\n    <\/div>\n    <div style=\"aspect-ratio:4/5;max-height:560px;border-radius:220px 220px 24px 24px;background:repeating-linear-gradient(135deg,#EFE3E7 0 12px,#F7EDF0 12px 24px);display:grid;place-items:center;animation:rise .9s .15s ease both\">\n      <span style=\"font-family:ui-monospace,monospace;font-size:12px;color:#736C79;background:#FBF6F3;padding:6px 10px;border-radius:6px\">photo: women at SAOL, warm daylight<\/span>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section style=\"padding:0 clamp(20px,4vw,56px) clamp(56px,7vw,96px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:#E9DCE0;border:1px solid #E9DCE0;border-radius:20px;overflow:hidden\">\n    <a href=\"#\" data-page=\"about\" sc-camel-on-click=\"{{ go }}\" style=\"display:block;padding:32px 28px;background:#F8E1E4;color:#2E2A33;min-height:220px\" style-hover=\"background:#F3D0D6;text-decoration:none\">\n      <p style=\"margin:0 0 40px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#984D61;font-weight:600\">01<\/p>\n      <h3 style=\"margin:0 0 8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px\">Our mission<\/h3>\n      <p style=\"margin:0;color:#66606C;line-height:1.5;font-size:15px\">Our goal, vision and commitment to the women we work with.<\/p>\n    <\/a>\n    <a href=\"#\" data-page=\"services\" sc-camel-on-click=\"{{ go }}\" style=\"display:block;padding:32px 28px;background:#DCE8DE;color:#2E2A33;min-height:220px\" style-hover=\"background:#CDE0D1;text-decoration:none\">\n      <p style=\"margin:0 0 40px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#984D61;font-weight:600\">02<\/p>\n      <h3 style=\"margin:0 0 8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px\">Our services<\/h3>\n      <p style=\"margin:0;color:#66606C;line-height:1.5;font-size:15px\">Rehabilitation, education, advocacy and childcare, all under one roof.<\/p>\n    <\/a>\n    <a href=\"#\" data-page=\"support\" sc-camel-on-click=\"{{ go }}\" style=\"display:block;padding:32px 28px;background:#DCE6F0;color:#2E2A33;min-height:220px\" style-hover=\"background:#CCDAEA;text-decoration:none\">\n      <p style=\"margin:0 0 40px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#984D61;font-weight:600\">03<\/p>\n      <h3 style=\"margin:0 0 8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px\">Get involved<\/h3>\n      <p style=\"margin:0;color:#66606C;line-height:1.5;font-size:15px\">Volunteer, take part, or donate.<\/p>\n    <\/a>\n  <\/div>\n<\/section>\n\n<section style=\"background:#E6E0F1;color:#2E2A33;padding:clamp(64px,9vw,128px) clamp(20px,4vw,56px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:48px;align-items:center\">\n    <p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,3.6vw,52px);line-height:1.15;text-wrap:balance\">We believe all women can embrace who they are, can define their future, and can change the world.<\/p>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:32px 24px;border-left:1px solid rgba(46,42,51,.2);padding-left:clamp(24px,4vw,56px)\">\n      <div><p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:56px;line-height:1\">30<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#66606C\">years in Dublin's north inner city<\/p><\/div>\n      <div><p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:56px;line-height:1\">1<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#66606C\">women-only day service, at your pace<\/p><\/div>\n      <div><p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:56px;line-height:1\">4<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#66606C\">strands: rehabilitation, education, advocacy, childcare<\/p><\/div>\n      <div><p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:56px;line-height:1\">IE<\/p><p style=\"margin:6px 0 0;font-size:14px;color:#66606C\">support online and by phone nationwide<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section style=\"padding:clamp(56px,8vw,112px) clamp(20px,4vw,56px)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:36px\">\n    <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(36px,4vw,56px);line-height:1\">Resources<\/h2>\n    <a href=\"#\" data-page=\"resources\" sc-camel-on-click=\"{{ go }}\" style=\"font-size:14px;font-weight:600;color:#2E2A33;border-bottom:1px solid #2E2A33\">All publications<\/a>\n  <\/div>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px\">\n    <sc-for list=\"{{ pubs }}\" as=\"pub\" hint-placeholder-count=\"6\">\n      <a href=\"#\" style=\"display:block;color:#2E2A33\" style-hover=\"text-decoration:none\">\n        <div style=\"aspect-ratio:3/4;border-radius:10px;background:repeating-linear-gradient(135deg,#EFE3E7 0 10px,#F7EDF0 10px 20px);display:grid;place-items:center;margin-bottom:12px\"><span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#736C79;background:#FBF6F3;padding:4px 8px;border-radius:5px\">cover<\/span><\/div>\n        <p style=\"margin:0;font-weight:600;font-size:14px\">{{ pub.title }}<\/p>\n        <p style=\"margin:2px 0 0;font-size:12px;color:#736C79\">{{ pub.kind }}<\/p>\n      <\/a>\n    <\/sc-for>\n  <\/div>\n<\/section>\n\n<section style=\"padding:0 clamp(20px,4vw,56px) clamp(56px,8vw,112px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));background:#F8E1E4;border-radius:24px;overflow:hidden\">\n    <div style=\"padding:clamp(36px,5vw,72px)\">\n      <p style=\"margin:0 0 16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">Join us<\/p>\n      <h2 style=\"margin:0 0 20px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,4.5vw,64px);line-height:1;text-wrap:balance\">Empower our women.<\/h2>\n      <p style=\"margin:0 0 32px;max-width:440px;line-height:1.55;color:#4A4450;text-wrap:pretty\">Every donation keeps the door open for a woman who has nowhere else to go. SAOL is a registered charity (No. 20065805).<\/p>\n      <a href=\"https://saolproject.enthuse.com/donate\" style=\"display:inline-block;padding:15px 26px;background:#984D61;border-radius:999px;color:#FBF6F3;font-weight:600\" style-hover=\"background:#7E3E50;text-decoration:none\">Donate now<\/a>\n    <\/div>\n    <div style=\"min-height:320px;background:repeating-linear-gradient(135deg,#F2D4DA 0 12px,#F8E4E8 12px 24px);display:grid;place-items:center\"><span style=\"font-family:ui-monospace,monospace;font-size:12px;color:#736C79;background:#FBF6F3;padding:6px 10px;border-radius:6px\">photo: recovery group, candid<\/span><\/div>\n  <\/div>\n<\/section>\n\n<section style=\"padding:0 clamp(20px,4vw,56px) clamp(64px,8vw,112px)\">\n  <p style=\"margin:0 0 24px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#736C79;text-align:center\">Proudly supported by<\/p>\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:12px 40px\">\n    <sc-for list=\"{{ funders }}\" as=\"f\" hint-placeholder-count=\"7\">\n      <span style=\"font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:#736C79;padding:8px 0\">{{ f }}<\/span>\n    <\/sc-for>\n  <\/div>\n<\/section>\n<\/sc-if>\n\n<!-- ABOUT -->\n<sc-if value=\"{{ p.about }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"About\" style=\"padding:clamp(48px,7vw,96px) clamp(20px,4vw,56px)\">\n  <p style=\"margin:0 0 20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">About SAOL<\/p>\n  <h1 style=\"margin:0 0 32px;max-width:900px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,5.5vw,80px);line-height:1;text-wrap:balance\">A community project for women affected by addiction and poverty.<\/h1>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(32px,5vw,72px)\">\n    <p style=\"margin:0;font-size:18px;line-height:1.6;color:#4A4450;text-wrap:pretty\">SAOL works with women who experience severe and multiple marginalisation: primarily addiction, but often combined with poverty, domestic and interpersonal violence, mental ill health, sex work, homelessness, time in care, involvement with criminal justice, and trauma, including the trauma of having children removed into care.<\/p>\n    <p style=\"margin:0;font-size:18px;line-height:1.6;color:#4A4450;text-wrap:pretty\">We support every participant as she navigates the cumulative impact of these interconnected needs, in a system that too often judges women on vulnerability, intention and deservingness.<\/p>\n  <\/div>\n<\/section>\n<section style=\"padding:0 clamp(20px,4vw,56px) clamp(56px,7vw,96px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px\">\n    <div style=\"padding:36px;background:#2E2A33;color:#FBF6F3;border-radius:20px\"><p style=\"margin:0 0 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#F3C9D1\">Mission<\/p><p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.25\">To improve the lives of women affected by addiction and poverty, empowering each woman to embrace her identity, define her future and create positive change in the world.<\/p><\/div>\n    <div style=\"padding:36px;background:#F8E1E4;border-radius:20px\"><p style=\"margin:0 0 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">Vision<\/p><p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.25\">A transformed approach to addiction and poverty in Ireland, where the unique needs of women are recognised and met with compassion and effectiveness.<\/p><\/div>\n  <\/div>\n<\/section>\n<section style=\"padding:0 clamp(20px,4vw,56px) clamp(56px,7vw,96px)\">\n  <h2 style=\"margin:0 0 32px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,4vw,52px);line-height:1\">What we stand for<\/h2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:#E9DCE0;border:1px solid #E9DCE0;border-radius:20px;overflow:hidden\">\n    <sc-for list=\"{{ values }}\" as=\"v\" hint-placeholder-count=\"5\">\n      <div style=\"padding:28px 24px;background:#FBF6F3\"><h3 style=\"margin:0 0 10px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px\">{{ v.t }}<\/h3><p style=\"margin:0;font-size:14px;line-height:1.55;color:#66606C\">{{ v.d }}<\/p><\/div>\n    <\/sc-for>\n  <\/div>\n<\/section>\n<section style=\"padding:0 clamp(20px,4vw,56px) clamp(56px,7vw,96px)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:32px\">\n    <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,4vw,52px);line-height:1\">The team<\/h2>\n    <p style=\"margin:0;font-size:14px;color:#736C79\">Led by Gary Broderick, CEO and Head of Services<\/p>\n  <\/div>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px 24px\">\n    <sc-for list=\"{{ teams }}\" as=\"t\" hint-placeholder-count=\"6\">\n      <div>\n        <div style=\"aspect-ratio:1;border-radius:16px;background:repeating-linear-gradient(135deg,#EFE3E7 0 10px,#F7EDF0 10px 20px);margin-bottom:14px;display:grid;place-items:center\"><span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#736C79;background:#FBF6F3;padding:4px 8px;border-radius:5px\">team photo<\/span><\/div>\n        <h3 style=\"margin:0 0 6px;font-size:17px;font-weight:700\">{{ t.name }}<\/h3>\n        <p style=\"margin:0;font-size:14px;line-height:1.5;color:#66606C\">{{ t.people }}<\/p>\n      <\/div>\n    <\/sc-for>\n  <\/div>\n<\/section>\n<section style=\"padding:0 clamp(20px,4vw,56px) clamp(64px,8vw,112px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:start\">\n    <div style=\"padding:36px;border:1px solid #E9DCE0;border-radius:20px\"><p style=\"margin:0 0 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">Board<\/p><p style=\"margin:0;line-height:1.7;color:#4A4450\">Catriona Crowe, Chairperson<br>Seanie Lambe, Secretary<br>Nessan Vaughan, Treasurer<\/p><\/div>\n    <div style=\"padding:36px;border:1px solid #E9DCE0;border-radius:20px\"><p style=\"margin:0 0 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">A call to services<\/p><p style=\"margin:0;line-height:1.6;color:#4A4450;text-wrap:pretty\">We invite every service provider to examine its response to women and adjust its practice to meet their needs. Together we can build a more inclusive community for women affected by addiction, poverty and severe disadvantage.<\/p><\/div>\n    <div style=\"padding:36px;background:#F8E1E4;border-radius:20px\"><p style=\"margin:0 0 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">Volunteers and placements<\/p><p style=\"margin:0 0 20px;line-height:1.6;color:#4A4450\">Interested in volunteering or completing a student placement with SAOL?<\/p><a href=\"#\" data-page=\"support\" sc-camel-on-click=\"{{ go }}\" style=\"font-weight:600;color:#2E2A33;border-bottom:1px solid #2E2A33\">Find out more<\/a><\/div>\n  <\/div>\n<\/section>\n<\/sc-if>\n\n<!-- SERVICES -->\n<sc-if value=\"{{ p.services }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"What we do\" style=\"padding:clamp(48px,7vw,96px) clamp(20px,4vw,56px)\">\n  <p style=\"margin:0 0 20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">What we do<\/p>\n  <h1 style=\"margin:0 0 24px;max-width:900px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,5.5vw,80px);line-height:1;text-wrap:balance\">From wherever you are, to wherever you want to go.<\/h1>\n  <p style=\"margin:0;max-width:640px;font-size:18px;line-height:1.6;color:#4A4450;text-wrap:pretty\">You don't need to have \"started\" recovery to come to SAOL. We work with women recovering from any substance or issue, focusing on what matters most to you, at your pace.<\/p>\n<\/section>\n<section style=\"padding:0 clamp(20px,4vw,56px) clamp(64px,8vw,112px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px\">\n    <sc-for list=\"{{ programmes }}\" as=\"s\" hint-placeholder-count=\"6\">\n      <div style=\"padding:32px 28px;border:1px solid #E0D8EC;border-radius:20px;background:#F3EEF7;display:flex;flex-direction:column;gap:12px;min-height:240px\">\n        <p style=\"margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#984D61;font-weight:600\">{{ s.tag }}<\/p>\n        <h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:32px;line-height:1.05\">{{ s.t }}<\/h3>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:#66606C;flex:1\">{{ s.d }}<\/p>\n      <\/div>\n    <\/sc-for>\n  <\/div>\n<\/section>\n<section style=\"background:#DCE8DE;color:#2E2A33;padding:clamp(56px,7vw,96px) clamp(20px,4vw,56px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;align-items:center\">\n    <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,4vw,56px);line-height:1.05;text-wrap:balance\">Ready to talk, or referring someone?<\/h2>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n      <a href=\"tel:018553391\" style=\"padding:15px 24px;background:#2E2A33;border-radius:999px;color:#FBF6F3;font-weight:600\" style-hover=\"background:#F3C9D1;color:#2E2A33;text-decoration:none\">Call (01) 855 3391<\/a>\n      <a href=\"#\" data-page=\"referral\" sc-camel-on-click=\"{{ go }}\" style=\"padding:15px 24px;border:1px solid #2E2A33;border-radius:999px;color:#2E2A33;font-weight:600\" style-hover=\"background:#2E2A33;color:#FBF6F3;text-decoration:none\">Referral form<\/a>\n    <\/div>\n  <\/div>\n<\/section>\n<\/sc-if>\n\n<!-- SUPPORT -->\n<sc-if value=\"{{ p.support }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Support us\" style=\"padding:clamp(48px,7vw,96px) clamp(20px,4vw,56px)\">\n  <p style=\"margin:0 0 20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">Support us<\/p>\n  <h1 style=\"margin:0 0 24px;max-width:900px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,5.5vw,80px);line-height:1;text-wrap:balance\">Help keep the door open.<\/h1>\n  <p style=\"margin:0;max-width:600px;font-size:18px;line-height:1.6;color:#4A4450;text-wrap:pretty\">SAOL is a registered charity (No. 20065805). Your support funds rehabilitation, education, advocacy and childcare for women in Dublin's north inner city and beyond.<\/p>\n<\/section>\n<section style=\"padding:0 clamp(20px,4vw,56px) clamp(64px,8vw,112px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start\">\n    <div style=\"padding:clamp(28px,4vw,44px);background:#F8E1E4;border-radius:24px\">\n      <h2 style=\"margin:0 0 8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:36px\">Donate<\/h2>\n      <p style=\"margin:0 0 24px;color:#66606C;font-size:15px\">Secure payment via Enthuse.<\/p>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px\">\n        <sc-for list=\"{{ amounts }}\" as=\"a\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ pickAmt }}\" style=\"height:52px;border-radius:12px;border:1px solid {{ a.border }};background:{{ a.bg }};color:{{ a.fg }};font-weight:700;font-size:16px;cursor:pointer\">{{ a.label }}<\/button>\n        <\/sc-for>\n      <\/div>\n      <div style=\"display:flex;gap:10px;margin-bottom:20px\">\n        <button data-freq=\"once\" sc-camel-on-click=\"{{ pickFreq }}\" style=\"flex:1;height:44px;border-radius:999px;border:1px solid #2E2A33;background:{{ freq.onceBg }};color:{{ freq.onceFg }};font-weight:600;cursor:pointer\">One-off<\/button>\n        <button data-freq=\"monthly\" sc-camel-on-click=\"{{ pickFreq }}\" style=\"flex:1;height:44px;border-radius:999px;border:1px solid #2E2A33;background:{{ freq.monthlyBg }};color:{{ freq.monthlyFg }};font-weight:600;cursor:pointer\">Monthly<\/button>\n      <\/div>\n      <a href=\"https://saolproject.enthuse.com/donate\" style=\"display:block;text-align:center;padding:16px;background:#984D61;border-radius:999px;color:#FBF6F3;font-weight:600\" style-hover=\"background:#7E3E50;text-decoration:none\">{{ donateLabel }}<\/a>\n    <\/div>\n    <div style=\"display:grid;gap:24px\">\n      <div style=\"padding:32px;border:1px solid #E9DCE0;border-radius:20px\"><h3 style=\"margin:0 0 10px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px\">Volunteer<\/h3><p style=\"margin:0 0 16px;line-height:1.55;color:#66606C;font-size:15px\">Give time and skills alongside our team. Roles range from front of house to group facilitation.<\/p><a href=\"#\" data-page=\"contact\" sc-camel-on-click=\"{{ go }}\" style=\"font-weight:600;color:#2E2A33;border-bottom:1px solid #2E2A33\">Get in touch<\/a><\/div>\n      <div style=\"padding:32px;border:1px solid #E9DCE0;border-radius:20px\"><h3 style=\"margin:0 0 10px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px\">Student placements<\/h3><p style=\"margin:0 0 16px;line-height:1.55;color:#66606C;font-size:15px\">Social care, social work and community education placements, supervised by experienced staff.<\/p><a href=\"#\" data-page=\"contact\" sc-camel-on-click=\"{{ go }}\" style=\"font-weight:600;color:#2E2A33;border-bottom:1px solid #2E2A33\">Enquire about a placement<\/a><\/div>\n      <div style=\"padding:32px;border:1px solid #E9DCE0;border-radius:20px\"><h3 style=\"margin:0 0 10px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px\">Fundraise<\/h3><p style=\"margin:0;line-height:1.55;color:#66606C;font-size:15px\">Run, bake, host or climb for SAOL. We'll help with materials and a fundraising page.<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/sc-if>\n\n<!-- RESOURCES -->\n<sc-if value=\"{{ p.resources }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Resources\" style=\"padding:clamp(48px,7vw,96px) clamp(20px,4vw,56px)\">\n  <p style=\"margin:0 0 20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">Resources<\/p>\n  <h1 style=\"margin:0 0 24px;max-width:900px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,5.5vw,80px);line-height:1;text-wrap:balance\">Publications, stories and tools.<\/h1>\n  <p style=\"margin:0;max-width:600px;font-size:18px;line-height:1.6;color:#4A4450\">Written with and for the women of SAOL. Free to download and share.<\/p>\n<\/section>\n<section style=\"padding:0 clamp(20px,4vw,56px) clamp(64px,8vw,112px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:28px 20px\">\n    <sc-for list=\"{{ pubs }}\" as=\"pub\" hint-placeholder-count=\"6\">\n      <a href=\"#\" style=\"display:block;color:#2E2A33\" style-hover=\"text-decoration:none\">\n        <div style=\"aspect-ratio:3/4;border-radius:12px;background:repeating-linear-gradient(135deg,#EFE3E7 0 10px,#F7EDF0 10px 20px);display:grid;place-items:center;margin-bottom:14px\"><span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#736C79;background:#FBF6F3;padding:4px 8px;border-radius:5px\">cover<\/span><\/div>\n        <p style=\"margin:0;font-weight:700;font-size:16px\">{{ pub.title }}<\/p>\n        <p style=\"margin:4px 0 0;font-size:13px;color:#736C79\">{{ pub.kind }} · PDF<\/p>\n      <\/a>\n    <\/sc-for>\n  <\/div>\n<\/section>\n<\/sc-if>\n\n<!-- NEWS -->\n<sc-if value=\"{{ p.news }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"News\" style=\"padding:clamp(48px,7vw,96px) clamp(20px,4vw,56px)\">\n  <p style=\"margin:0 0 20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">News<\/p>\n  <h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,5.5vw,80px);line-height:1\">What's happening at SAOL.<\/h1>\n<\/section>\n<section style=\"padding:0 clamp(20px,4vw,56px) clamp(64px,8vw,112px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px\">\n    <sc-for list=\"{{ news }}\" as=\"n\" hint-placeholder-count=\"3\">\n      <a href=\"#\" style=\"display:block;color:#2E2A33\" style-hover=\"text-decoration:none\">\n        <div style=\"aspect-ratio:16/10;border-radius:16px;background:repeating-linear-gradient(135deg,#EFE3E7 0 12px,#F7EDF0 12px 24px);display:grid;place-items:center;margin-bottom:16px\"><span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#736C79;background:#FBF6F3;padding:4px 8px;border-radius:5px\">{{ n.img }}<\/span><\/div>\n        <p style=\"margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#984D61;font-weight:600\">{{ n.tag }}<\/p>\n        <h3 style=\"margin:0 0 8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;line-height:1.1\">{{ n.t }}<\/h3>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:#66606C\">{{ n.d }}<\/p>\n      <\/a>\n    <\/sc-for>\n  <\/div>\n<\/section>\n<\/sc-if>\n\n<!-- CONTACT -->\n<sc-if value=\"{{ p.contact }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Contact\" style=\"padding:clamp(48px,7vw,96px) clamp(20px,4vw,56px) clamp(64px,8vw,112px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(32px,5vw,72px)\">\n    <div>\n      <p style=\"margin:0 0 20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">Contact<\/p>\n      <h1 style=\"margin:0 0 32px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,5.5vw,80px);line-height:1\">Come in, call, or write.<\/h1>\n      <div style=\"display:grid;gap:24px;font-size:17px;line-height:1.55;color:#4A4450\">\n        <div><p style=\"margin:0 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#736C79;font-weight:600\">Visit<\/p>58 Amiens Street<br>Dublin 1<\/div>\n        <div><p style=\"margin:0 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#736C79;font-weight:600\">Phone<\/p><a href=\"tel:018553391\" style=\"color:#2E2A33\">(01) 855 3391<\/a><\/div>\n        <div><p style=\"margin:0 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#736C79;font-weight:600\">Email<\/p><a href=\"mailto:admin@saolproject.ie\" style=\"color:#2E2A33\">admin@saolproject.ie<\/a><\/div>\n        <div><p style=\"margin:0 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#736C79;font-weight:600\">Referrals<\/p><a href=\"#\" data-page=\"referral\" sc-camel-on-click=\"{{ go }}\" style=\"color:#2E2A33;border-bottom:1px solid #2E2A33\">Open the referral form<\/a><\/div>\n      <\/div>\n    <\/div>\n    <div style=\"aspect-ratio:4/3;border-radius:24px;background:repeating-linear-gradient(135deg,#EFE3E7 0 12px,#F7EDF0 12px 24px);display:grid;place-items:center;align-self:start\"><span style=\"font-family:ui-monospace,monospace;font-size:12px;color:#736C79;background:#FBF6F3;padding:6px 10px;border-radius:6px\">map: 58 Amiens Street, Dublin 1<\/span><\/div>\n  <\/div>\n<\/section>\n<\/sc-if>\n\n<!-- REFERRAL -->\n<sc-if value=\"{{ p.referral }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Referral form\" style=\"padding:clamp(48px,7vw,96px) clamp(20px,4vw,56px) clamp(64px,8vw,112px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(32px,5vw,72px);align-items:start\">\n    <div>\n      <p style=\"margin:0 0 20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#984D61\">Referral form<\/p>\n      <h1 style=\"margin:0 0 24px;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,5.5vw,72px);line-height:1;text-wrap:balance\">Refer yourself, or someone you work with.<\/h1>\n      <p style=\"margin:0 0 16px;font-size:17px;line-height:1.6;color:#4A4450;text-wrap:pretty\">Women can self-refer. Services, GPs, social workers and probation officers can refer with the woman's consent. We'll be in touch within a few working days to arrange a first conversation.<\/p>\n      <p style=\"margin:0;font-size:14px;color:#736C79\">Prefer to talk first? Call <a href=\"tel:018553391\">(01) 855 3391<\/a>.<\/p>\n    <\/div>\n    <form sc-camel-on-submit=\"{{ submitReferral }}\" style=\"display:grid;gap:16px;padding:clamp(24px,3vw,40px);background:#FFFFFF;border:1px solid #E9DCE0;border-radius:24px\">\n      <label style=\"display:grid;gap:6px;font-size:13px;font-weight:600\">I am<sc-raw-select style=\"height:48px;padding:0 14px;border:1px solid #E9DCE0;border-radius:12px;background:#FBF6F3;font-size:15px\"><option>Referring myself<\/option><option>A family member or friend<\/option><option>A service or professional<\/option><\/sc-raw-select><\/label>\n      <label style=\"display:grid;gap:6px;font-size:13px;font-weight:600\">Name<input placeholder=\"Full name\" style=\"height:48px;padding:0 14px;border:1px solid #E9DCE0;border-radius:12px;background:#FBF6F3;font-size:15px\"><\/label>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px\">\n        <label style=\"display:grid;gap:6px;font-size:13px;font-weight:600\">Phone<input placeholder=\"08x xxx xxxx\" style=\"height:48px;padding:0 14px;border:1px solid #E9DCE0;border-radius:12px;background:#FBF6F3;font-size:15px\"><\/label>\n        <label style=\"display:grid;gap:6px;font-size:13px;font-weight:600\">Email<input placeholder=\"Optional\" style=\"height:48px;padding:0 14px;border:1px solid #E9DCE0;border-radius:12px;background:#FBF6F3;font-size:15px\"><\/label>\n      <\/div>\n      <label style=\"display:grid;gap:6px;font-size:13px;font-weight:600\">Best time to contact<input placeholder=\"e.g. weekday mornings\" style=\"height:48px;padding:0 14px;border:1px solid #E9DCE0;border-radius:12px;background:#FBF6F3;font-size:15px\"><\/label>\n      <label style=\"display:grid;gap:6px;font-size:13px;font-weight:600\">Anything you'd like us to know<textarea rows=\"4\" placeholder=\"Only what you're comfortable sharing\" style=\"padding:12px 14px;border:1px solid #E9DCE0;border-radius:12px;background:#FBF6F3;font-size:15px;resize:vertical\"><\/textarea><\/label>\n      <label style=\"display:flex;gap:10px;align-items:start;font-size:13px;line-height:1.5;color:#66606C\"><input type=\"checkbox\" style=\"margin-top:3px;width:18px;height:18px\">The woman being referred knows about and consents to this referral.<\/label>\n      <button type=\"submit\" style=\"height:52px;border:0;border-radius:999px;background:#984D61;color:#FBF6F3;font-weight:600;font-size:15px;cursor:pointer\">{{ referralLabel }}<\/button>\n      <p style=\"margin:0;font-size:12px;color:#736C79;text-align:center\">Your details are held securely and only used to arrange contact.<\/p>\n    <\/form>\n  <\/div>\n<\/section>\n<\/sc-if>\n\n<\/main>\n\n<!-- FOOTER -->\n<footer style=\"background:#4A3D52;color:#FBF6F3;padding:clamp(48px,6vw,80px) clamp(20px,4vw,56px) 32px\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:40px;margin-bottom:56px\">\n    <div>\n      <p style=\"margin:0 0 16px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;letter-spacing:.06em\">SAOL<\/p>\n      <p style=\"margin:0;font-size:14px;line-height:1.7;color:#D8CFDD\">58 Amiens Street, Dublin 1<br><a href=\"tel:018553391\" style=\"color:#FBF6F3\">(01) 855 3391<\/a><br><a href=\"mailto:admin@saolproject.ie\" style=\"color:#FBF6F3\">admin@saolproject.ie<\/a><br>Registered Charity No. 20065805<\/p>\n    <\/div>\n    <div style=\"display:grid;gap:10px;font-size:14px;align-content:start\">\n      <p style=\"margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8D8592;font-weight:600\">Quick links<\/p>\n      <a href=\"#\" data-page=\"about\" sc-camel-on-click=\"{{ go }}\" style=\"color:#FBF6F3\">About<\/a>\n      <a href=\"#\" data-page=\"services\" sc-camel-on-click=\"{{ go }}\" style=\"color:#FBF6F3\">What we do<\/a>\n      <a href=\"#\" data-page=\"support\" sc-camel-on-click=\"{{ go }}\" style=\"color:#FBF6F3\">Support us<\/a>\n      <a href=\"#\" data-page=\"resources\" sc-camel-on-click=\"{{ go }}\" style=\"color:#FBF6F3\">Resources<\/a>\n      <a href=\"#\" data-page=\"news\" sc-camel-on-click=\"{{ go }}\" style=\"color:#FBF6F3\">News<\/a>\n      <a href=\"#\" data-page=\"referral\" sc-camel-on-click=\"{{ go }}\" style=\"color:#FBF6F3\">Referral form<\/a>\n    <\/div>\n    <div>\n      <p style=\"margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8D8592;font-weight:600\">Updates<\/p>\n      <p style=\"margin:0 0 14px;font-size:14px;color:#D8CFDD;line-height:1.5\">Occasional news from SAOL. No spam.<\/p>\n      <div style=\"display:flex;gap:8px\">\n        <input placeholder=\"Email address\" style=\"flex:1;min-width:0;height:46px;padding:0 14px;border:1px solid rgba(251,246,243,.25);border-radius:999px;background:transparent;color:#FBF6F3;font-size:14px\">\n        <button style=\"height:46px;padding:0 18px;border:0;border-radius:999px;background:#FBF6F3;color:#2E2A33;font-weight:600;cursor:pointer\">Sign up<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:24px;border-top:1px solid rgba(251,246,243,.15);font-size:12px;color:#8D8592\">\n    <span>© 2026 The SAOL Project<\/span>\n    <div style=\"display:flex;gap:20px\"><a href=\"#\" style=\"color:#8D8592\">Terms of use<\/a><a href=\"#\" style=\"color:#8D8592\">Privacy<\/a><a href=\"#\" style=\"color:#8D8592\">Governance<\/a><a href=\"https://linktr.ee/thesaolproject\" style=\"color:#8D8592\">Social<\/a><\/div>\n  <\/div>\n<\/footer>\n<\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;frame&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;mobile&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop' | 'mobile'&quot;,&quot;section&quot;:&quot;Preview&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: 'home', width: 1200, menuOpen: false, amt: 25, freq: 'monthly', sent: false };\n  rootRef = React.createRef();\n  componentDidMount() {\n    const el = this.rootRef.current; if (!el) return;\n    this.ro = new ResizeObserver(([e]) => this.setState({ width: e.contentRect.width }));\n    this.ro.observe(el);\n  }\n  componentWillUnmount() { this.ro && this.ro.disconnect(); }\n  renderVals() {\n    const { page, width, menuOpen, amt, freq, sent } = this.state;\n    const frame = this.props.frame ?? 'desktop';\n    const isMobile = frame === 'mobile' || width < 900;\n    const pages = ['home','about','services','support','resources','news','contact','referral'];\n    const p = {}; pages.forEach(k => p[k] = page === k);\n    const c = {}; pages.forEach(k => c[k] = page === k ? '#984D61' : '#4A4450');\n    const amounts = [10, 25, 50, 100, 250, 500].map(v => ({ label: '€' + v, v, bg: v === amt ? '#984D61' : 'transparent', fg: v === amt ? '#FBF6F3' : '#2E2A33', border: v === amt ? '#984D61' : '#D9BFC5' }));\n    const on = { onceBg: freq === 'once' ? '#2E2A33' : 'transparent', onceFg: freq === 'once' ? '#FBF6F3' : '#2E2A33', monthlyBg: freq === 'monthly' ? '#2E2A33' : 'transparent', monthlyFg: freq === 'monthly' ? '#FBF6F3' : '#2E2A33' };\n    return {\n      rootRef: this.rootRef,\n      frameMax: frame === 'mobile' ? '390px' : '1440px',\n      isDesktop: !isMobile, isMobile, menuOpen: isMobile && menuOpen,\n      p, c,\n      go: e => { e.preventDefault(); this.setState({ page: e.currentTarget.dataset.page, menuOpen: false, sent: false }); window.scrollTo(0, 0); },\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      amounts, pickAmt: e => this.setState({ amt: Number(e.currentTarget.textContent.replace('€','')) }),\n      freq: on, pickFreq: e => this.setState({ freq: e.currentTarget.dataset.freq }),\n      donateLabel: `Donate €${amt}${freq === 'monthly' ? ' a month' : ''}`,\n      referralLabel: sent ? 'Thank you. We\\'ll be in touch.' : 'Send referral',\n      submitReferral: e => { e.preventDefault(); this.setState({ sent: true }); },\n      pubs: [\n        { title: 'Hep C Stories 2', kind: 'Stories' }, { title: 'Reducing the Use', kind: 'Guide' }, { title: 'Scéals and Anthems', kind: 'Anthology' },\n        { title: 'ICU', kind: 'Report' }, { title: 'RecoverMe', kind: 'Workbook' }, { title: 'RTU', kind: 'Report' }\n      ],\n      funders: ['Rethink Ireland', 'HSE', 'NICDTF', 'Probation Service', 'Dept. of Social Protection', 'City of Dublin ETB', 'CUAN'],\n      values: [\n        { t: 'Empowerment', d: 'Every woman has the potential to overcome challenges and reach her goals.' },\n        { t: 'Inclusivity', d: 'Accessible and supportive for all women, whatever stage of recovery.' },\n        { t: 'Advocacy', d: 'We highlight and address the specific needs of women who use drugs.' },\n        { t: 'Community', d: 'A supportive environment built on connection and mutual support.' },\n        { t: 'Feminism', d: 'Political, economic and social equality for all genders, not yet achieved.' }\n      ],\n      teams: [\n        { name: 'Admin', people: 'Patricia Mullane, Vanessa Lynch, Deirdre Clinton' },\n        { name: 'CE Team', people: 'Jackie Kelly, Mark Brogan, Monika Kaczorek' },\n        { name: 'BRIO', people: 'Paula Kearney, Rose Toal, Aoife Ní Chathmhaoil' },\n        { name: 'DAVINA', people: 'Rachel Fayne, Louise Rafftery, Ciara Kearney, Carrie Burgess, Gillian Dennehy' },\n        { name: 'UChoose / Healthcare', people: 'Tori Clarke, Jennifer Mooney, Carrie Burgess' },\n        { name: \"Children's Project\", people: 'Eli Colomer, Velat Aklas, Engling Lin' }\n      ],\n      programmes: [\n        { tag: 'Rehabilitation', t: 'Day programme', d: 'Structured, women-only rehabilitation with key working and case management, tailored to where you are and where you want to go.' },\n        { tag: 'Programme', t: 'Seeking Safety', d: 'A present-focused approach to trauma and substance use, built on safety, coping skills and self-care.' },\n        { tag: 'Aftercare', t: 'UChoose', d: 'Ongoing support, social work and healthcare after the programme, so recovery has somewhere to go next.' },\n        { tag: 'Key working', t: 'BRIO', d: 'One-to-one key working and case management for women navigating multiple services at once.' },\n        { tag: 'Advocacy', t: 'DAVINA', d: 'Advocates and training that put women\\'s voices at the centre of the services meant to serve them.' },\n        { tag: 'Childcare', t: \"Children's Project\", d: 'Care and support for the children of women on our programmes, so mothers can take part fully.' },\n        { tag: 'Education', t: 'Learning and skills', d: 'Accredited and informal education that builds confidence, skills and options.' },\n        { tag: 'Campaign', t: 'Object Poverty', d: 'Our work to change how Ireland responds to women living with poverty and addiction.' }\n      ],\n      news: [\n        { tag: 'Anniversary', t: 'SAOL at 30', d: 'Three decades of women-led recovery in Dublin 1. Events, stories and thanks.', img: 'photo: anniversary event' },\n        { tag: 'Advocacy', t: 'FRIDA', d: 'Placeholder summary. Replace with the latest on the FRIDA programme.', img: 'photo: FRIDA' },\n        { tag: 'Recovery', t: 'Recovery stories', d: 'Placeholder summary. Replace with a recent participant or staff story.', img: 'photo: participant' }\n      ]\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
